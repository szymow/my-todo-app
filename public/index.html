[data-theme="dark"] .badge.bg-light,

    background-color: #444444 !important;

<body>

<div class="d-flex justify-content-between align-items-center mb-4">

<div class="card shadow-sm mb-4">

            <div class="text-nowrap">
                <h5 class="mb-0">

                        Pozostało: <span id="activeCount">0</span> z <span id="totalCount">0</span>

                     class="progress-bar bg-success progress-bar-striped progress-bar-animated" 
                     role="progressbar" 
                     style="width: 0%;"

<div class="mb-3 d-flex flex-wrap gap-2" id="filterContainer">
    <button class="btn btn-sm btn-outline-secondary active" onclick="filterTasks('all', this)">wszystkie</button>
    <button class="btn btn-sm btn-outline-primary" onclick="filterTasks('praca', this)">praca</button>
    <button class="btn btn-sm btn-outline-success" onclick="filterTasks('dom', this)">dom</button>
    <button class="btn btn-sm btn-outline-warning text-dark" onclick="filterTasks('hobby', this)">hobby</button>
    <button class="btn btn-sm btn-outline-secondary" onclick="filterTasks('ogólne', this)">ogólne</button>
</div>

            <ul id="taskList" class="list-group card overflow-hidden"></ul>
        </div>
    </div>

<script>

let tasks = []; // Definicja globalna

    const API_URL = ''; // Zostaw puste, jeśli frontend i backend są na tym samym serwerze

    // Główna funkcja sprawdzająca czy jesteśmy zalogowani
    function checkLogin() {
        const token = localStorage.getItem('token');
        if (token) {
            document.getElementById('authSection').classList.add('hidden');
            document.getElementById('todoSection').classList.remove('hidden');
            fetchTasks();
        } else {
            document.getElementById('authSection').classList.remove('hidden');
            document.getElementById('todoSection').classList.add('hidden');
        }
    }

    // Obsługa Logowania i Rejestracji
    async function handleAuth(type) {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const errorDiv = document.getElementById('authError');

        try {
            const res = await fetch(`/auth/${type}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();

            if (!res.ok) throw new Error(data.error || 'Błąd autoryzacji');

            if (type === 'login') {
                localStorage.setItem('token', data.token);
                checkLogin();
            } else {
                alert('Konto stworzone! Możesz się zalogować.');
            }
        } catch (err) {
            errorDiv.innerText = err.message;
        }
    }

    function logout() {
        localStorage.removeItem('token');
        checkLogin();
    }

    // Pobieranie zadań z tokenem JWT w nagłówku

function getCategoryBadge(category) {
    const colors = {
        'praca': 'bg-primary text-white',
        'dom': 'bg-success text-white',
        'hobby': 'bg-warning text-dark',
        'ogólne': 'bg-secondary text-white'
    };
    
    // Jeśli kategoria to null/undefined, ustawiamy "ogólne"
    const cat = category || 'ogólne'; 
    const color = colors[cat] || 'bg-secondary text-white';

    return `<span class="badge ${color}">${cat}</span>`;
}

async function fetchTasks() {
    const token = localStorage.getItem('token');
    const list = document.getElementById('taskList'); // Tutaj jest zmienna "list"
    
    const activeCountEl = document.getElementById('activeCount');
    const totalCountEl = document.getElementById('totalCount');
    const progressBar = document.getElementById('taskProgressBar');

    if (!token) {
        console.error("Brak tokena - zaloguj się.");
        return;
    }

    try {
        const res = await fetch('/tasks', {
            method: 'GET',
            headers: { 'Authorization': `Bearer ${token}` }
        });

        if (!res.ok) throw new Error("Błąd pobierania danych");

        const tasks = await res.json();

        if (typeof checkDeadlines === 'function') checkDeadlines(tasks);

        list.innerHTML = ''; // Czyszczenie listy

        // --- 1. LOGIKA LICZNIKÓW I PASKA POSTĘPU ---
        const total = tasks.length;
        const completed = tasks.filter(t => t.completed).length;
        const active = total - completed;

        if (activeCountEl) activeCountEl.innerText = active;
        if (totalCountEl) totalCountEl.innerText = total;

        if (progressBar) {
            const progressPercent = total > 0 ? Math.round((completed / total) * 100) : 0;
            progressBar.style.width = progressPercent + '%';
            progressBar.innerText = progressPercent + '%';
            progressBar.setAttribute('aria-valuenow', progressPercent);
        }

        if (total === 0) {
            list.innerHTML = '<li class="list-group-item text-center text-muted p-4">Brak zadań na liście</li>';
            return;
        }

        // --- 2. RENDEROWANIE LISTY ---
        tasks.forEach(task => {
            const li = document.createElement('li');

            // --- KOLOR OBRAMOWANIA PRIORYTETU ---
            let priorityClass = 'border-info'; // Domyślnie niski
            if (task.priority === 'high') priorityClass = 'border-danger';
            else if (task.priority === 'medium') priorityClass = 'border-warning';

            // Połączone klasy z Twoim oryginalnym kodem + kolorowy pasek po lewej stronie
            li.className = `list-group-item d-flex justify-content-between align-items-center mb-2 shadow-sm bg-white rounded-3 p-3 border-start border-5 ${priorityClass}`;

            const deadlineHtml = task.dueDate 
                ? `<span class="text-muted ms-2" style="font-size: 0.85rem;"><i class="far fa-clock"></i> ${new Date(task.dueDate).toLocaleString([], {hour: '2-digit', minute:'2-digit', day: '2-digit', month: '2-digit'})}</span>` 
                : '';

            li.innerHTML = `
                <div class="d-flex align-items-center" style="min-width: 0; flex: 1;">
                    <span class="task-title ${task.completed ? 'text-decoration-line-through text-muted' : 'fw-bold'}" 
                          onclick="toggleTask('${task._id}')" style="cursor:pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 80%; display: block;">
                        ${task.title}
                    </span>
                </div>

                <div class="d-flex align-items-center gap-2 flex-shrink-0">
                    
                    ${typeof getCategoryBadge === 'function' ? getCategoryBadge(task.category) : `<span class="badge bg-secondary">${task.category || 'ogólne'}</span>`} 

                    <span class="badge bg-light text-dark border text-uppercase" style="font-size: 0.75rem;">${task.priority}</span>

                    ${deadlineHtml}

                    <div class="vr mx-1"></div>

                    <i class="fas fa-edit text-primary fs-5" 
                       onclick="editTask('${task._id}', '${task.title.replace(/'/g, "\\'")}', '${task.dueDate || ''}', '${task.priority}', '${task.category || 'ogólne'}')" 
                       style="cursor:pointer"></i>
                    
                    <i class="fas fa-trash text-danger fs-5" onclick="deleteTask('${task._id}')" style="cursor:pointer"></i>
                </div>
            `;

            list.appendChild(li); // ✅ Zmieniono z taskList.appendChild na list.appendChild!
        });

    } catch (err) {
        console.error("Błąd w fetchTasks:", err);
    }
}

function filterTasks(category, clickedButton) {
    // 1. Wizualna zmiana aktywnego przycisku
    const buttons = document.querySelectorAll('#filterContainer .btn');
    buttons.forEach(btn => btn.classList.remove('active')); // Zabieramy podświetlenie wszystkim
    clickedButton.classList.add('active'); // Dajemy podświetlenie klikniętemu

    // 2. Pobieramy wszystkie kafelki zadań z listy
    const taskElements = document.querySelectorAll('#taskList .list-group-item');

    taskElements.forEach(taskEl => {
        // Szukamy tekstu wewnątrz plakietki badge (pobieramy wszystkie spany i szukamy badge'a)
        const badges = taskEl.querySelectorAll('.badge'); 
        let taskCategory = 'ogólne';

        // Przeszukujemy odznaki w poszukiwaniu tekstu kategorii
        badges.forEach(badge => {
            const text = badge.innerText.trim().toLowerCase();
            if (['praca', 'dom', 'hobby', 'ogólne'].includes(text)) {
                taskCategory = text;
            }
        });

        // 3. Logika ukrywania/pokazywania (używamy !important dla pewności)
        if (category === 'all' || taskCategory === category.toLowerCase()) {
            taskEl.style.setProperty('display', 'flex', 'important'); // Pokaż
        } else {
            taskEl.style.setProperty('display', 'none', 'important'); // Ukryj
        }
    });
}


// 1. GŁÓWNA FUNKCJA (DODAWANIE / ZAPISYWANIE)
async function handleTaskSubmit() {
    // 1. Pobieramy przycisk po unikalnym ID (Bezpiecznie!)
    const addBtn = document.getElementById('submitTaskBtn');

    const editId = document.getElementById('editTaskId').value;
    const title = document.getElementById('taskInput').value;
    const priority = document.getElementById('taskPriority').value;
    const category = document.getElementById('taskCategory').value;
    const dueDateInput = document.getElementById('taskDeadline').value;

    if (!title) return alert("Wpisz treść zadania!");

    // ✅ Znak zapytania '?' sprawi, że jeśli przycisk nie istnieje, JS nie przerwie działania!
    addBtn?.classList.add('btn-pulse', 'btn-secondary');

    const taskData = { title, priority, category };
    taskData.dueDate = dueDateInput === "" ? null : dueDateInput;

    const url = editId ? `/tasks/${editId}` : '/tasks';
    const method = editId ? 'PATCH' : 'POST';

    try {
        const res = await fetch(url, {
            method: method,
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${localStorage.getItem('token')}`
            },
            body: JSON.stringify(taskData)
        });

        if (res.ok) {
            cancelEdit();
            fetchTasks();
        } else {
            const errorData = await res.json();
            alert("Błąd zapisu: " + (errorData.message || "Błędne dane."));
        }
    } catch (err) {
        console.error("Błąd połączenia:", err);
        alert("Błąd połączenia z serwerem.");
    } finally {
        // ✅ Tutaj również dajemy znak zapytania '?' dla bezpieczeństwa
        addBtn?.classList.remove('btn-pulse', 'btn-secondary');
    }
}

// 2. FUNKCJA ŁADUJĄCA DANE DO EDYCJI
// Dopisujemy "category" jako piąty parametr funkcji
function editTask(id, title, dueDate, priority, category) {
    document.getElementById('editTaskId').value = id;
    document.getElementById('taskInput').value = title;
    document.getElementById('taskPriority').value = priority;
    document.getElementById('taskCategory').value = category || "ogólne"; // <-- NOWE: Ustawiamy kategorię
    
    if (dueDate && dueDate !== 'null') {
        const d = new Date(dueDate);
        const formattedDate = d.toISOString().slice(0, 16);
        document.getElementById('taskDeadline').value = formattedDate;
    }

    const btn = document.getElementById('submitTaskBtn');
    btn.innerText = "Zapisz zmiany";
    btn.classList.replace('btn-primary', 'btn-warning');
    document.getElementById('cancelEditBtn').classList.remove('d-none');
    
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// 3. FUNKCJA ANULUJĄCA EDYCJĘ
function cancelEdit() {
    // 1. Czyszczenie pól (zabezpieczone przed null za pomocą if)
    const editIdField = document.getElementById('editTaskId');
    const inputField = document.getElementById('taskInput');
    const deadlineField = document.getElementById('taskDeadline');
    const priorityField = document.getElementById('taskPriority');
    const categoryField = document.getElementById('taskCategory');

    if (editIdField) editIdField.value = '';
    if (inputField) inputField.value = '';
    if (deadlineField) deadlineField.value = '';
    if (priorityField) priorityField.value = 'low';
    if (categoryField) categoryField.value = 'ogólne';

    // 2. Przywrócenie tekstu głównego przycisku
    const submitBtn = document.getElementById('submitTaskBtn');
    if (submitBtn) {
        submitBtn.innerText = 'Dodaj';
    }

    // 3. 🛡️ PANCERNE ZABEZPIECZENIE (Dodaj ?. przed classList)
    document.getElementById('cancelEditBtn')?.classList.add('d-none');
}
    async function deleteTask(id) {
        const token = localStorage.getItem('token');
        await fetch(`/tasks/${id}`, { 
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${token}` }
        });
        fetchTasks();
    }

    checkLogin();

tasks.forEach(task => {
    const li = document.createElement('li');
    
    let warningClass = '';
    let dateHtml = '';

    // 1. Twoja Logika przetwarzania daty (zostaje bez zmian)
    if (task.dueDate) {
        const deadline = new Date(task.dueDate);
        const now = new Date();
        const diffMs = deadline - now;
        const diffHours = diffMs / (1000 * 60 * 60);

        const formattedDate = deadline.toLocaleString('pl-PL', {
            day: '2-digit', 
            month: '2-digit', 
            year: 'numeric',
            hour: '2-digit', 
            minute: '2-digit'
        });

        dateHtml = `<span class="text-muted ms-2" style="font-size: 0.85rem;"><i class="far fa-clock"></i> ${formattedDate}</span>`;

        if (!task.completed) {
            if (diffMs < 0) {
                warningClass = 'bg-danger-subtle opacity-75';
            } else if (diffHours <= 2) {
                warningClass = 'animate__animated animate__pulse animate__infinite border-danger shadow-sm';
            }
        }
    }

    // 2. Kolor paska bocznego (priorytet)
    let priorityColor = 'border-info';
    if (task.priority === 'high') priorityColor = 'border-danger';
    else if (task.priority === 'medium') priorityColor = 'border-warning';

    // Łączymy klasy (dodajemy border bg-white rounded p-3)
    li.className = `list-group-item d-flex justify-content-between align-items-center mb-2 shadow-sm border bg-white rounded p-3 border-start border-5 ${priorityColor} ${warningClass}`;

    // 3. Budowanie NOWEJ struktury kafelka (Wszystko w jednej osi!)
    li.innerHTML = `
        <div class="d-flex align-items-center" style="min-width: 0; flex: 1;">
            <span class="${task.completed ? 'text-decoration-line-through text-muted' : 'fw-bold'}" 
                  style="cursor:pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70%; display: block;" 
                  onclick="toggleTask('${task._id}')">
                ${task.title}
            </span>
            ${dateHtml} </div>

        <div class="d-flex align-items-center gap-3 flex-shrink-0">
            
            ${typeof getCategoryBadge === 'function' ? getCategoryBadge(task.category) : `<span class="badge bg-secondary">${task.category || 'ogólne'}</span>`}

            <span class="badge bg-light text-dark border text-uppercase" style="font-size: 0.75rem;">
                ${task.priority}
            </span>

            <div class="vr mx-1"></div>

            <i class="fas fa-edit text-primary fs-5" style="cursor:pointer" 
               onclick="editTask('${task._id}', '${task.title.replace(/'/g, "\\'")}', '${task.dueDate || ''}', '${task.priority}', '${task.category || 'ogólne'}')"></i>

            <i class="fas fa-trash text-danger fs-5" style="cursor:pointer" onclick="deleteTask('${task._id}')"></i>
        </div>
    `;
    list.appendChild(li);
});

const taskInput = document.getElementById('taskInput');
const addBtn = document.querySelector('button[onclick="addTask()"]'); // Znajduje przycisk dodawania

taskInput.addEventListener('input', () => {
    const value = taskInput.value.trim();
    
    if (value === "") {
        // Gdy puste: pulsuje i jest szary
        addBtn?.classList.add('btn-pulse', 'btn-secondary');
        addBtn?.classList.remove('btn-success');
    } else {
        // Gdy coś wpisano: przestaje pulsować i robi się zielony
        addBtn?.classList.remove('btn-pulse', 'btn-secondary');
        addBtn?.classList.add('btn-success');
    }
});

// Uruchomienie sprawdzenia na starcie, żeby przycisk pulsował od razu po załadowaniu
taskInput.dispatchEvent(new Event('input'));

async function toggleTask(id) {
    const token = localStorage.getItem('token');
    
    try {
        const res = await fetch(`/tasks/${id}/toggle`, {
            method: 'PATCH',
            headers: { 'Authorization': `Bearer ${token}` }
        });

        if (res.ok) {
            // KLUCZOWY MOMENT: 
            // Po zmianie statusu w bazie, musimy ponownie wywołać fetchTasks(),
            // aby przeliczyło procenty i odświeżyło widok!
            await fetchTasks(); 
        }
    } catch (err) {
        console.error("Błąd toggle:", err);
    }
}

const themeToggle = document.getElementById('themeToggle');
const currentTheme = localStorage.getItem('theme');

// Sprawdź, czy użytkownik miał już wybrany motyw
if (currentTheme === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');

document.addEventListener('DOMContentLoaded', () => {
    const themeToggle = document.getElementById('themeToggle');
    if (!themeToggle) return; // Jeśli nie znajdzie przycisku, nie wywali błędu

    // Funkcja pomocnicza do zmiany ikon i tekstu
    const updateBtn = (isDark) => {
        themeToggle.innerHTML = isDark 
            ? '<i class="fas fa-sun"></i> Tryb Jasny' 
            : '<i class="fas fa-moon"></i> Tryb Ciemny';
    };

    // 1. Sprawdź zapisany motyw
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        updateBtn(true);
    }

    // 2. Obsługa kliknięcia
    themeToggle.addEventListener('click', () => {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        
        if (isDark) {
            document.documentElement.removeAttribute('data-theme');
            localStorage.setItem('theme', 'light');
            updateBtn(false);
        } else {
            document.documentElement.setAttribute('data-theme', 'dark');
            localStorage.setItem('theme', 'dark');
            updateBtn(true);
        }
    });
});

function toggleDarkMode() {
    const html = document.documentElement;
    const btn = document.getElementById('themeToggle');
    const isDark = html.getAttribute('data-theme') === 'dark';

    if (isDark) {
        html.removeAttribute('data-theme');
        localStorage.setItem('theme', 'light');
        btn.innerHTML = '<i class="fas fa-moon"></i> Tryb Ciemny';
    } else {
        html.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
        btn.innerHTML = '<i class="fas fa-sun"></i> Tryb Jasny';
    }
}

function requestNotificationPermission() {
    if ("Notification" in window) {
        Notification.requestPermission().then(permission => {
            if (permission === "granted") {
                console.log("Powiadomienia włączone!");
            }
        });
    }
}

// Wywołaj przy ładowaniu strony
requestNotificationPermission();

// Tablica do przechowywania ID zadań, o których już powiadomiliśmy (żeby nie spamować)
// Zbiór wysłanych powiadomień (zostawiamy go poza funkcją)
let notifiedTasks = new Set(); 

function checkDeadlines(tasks) {
    // 1. BEZPIECZEŃSTWO MOBILNE: Jeśli przeglądarka nie obsługuje Notification, po prostu wyjdź
    if (!("Notification" in window) || Notification.permission !== "granted") {
        return; 
    }

    const now = new Date();
    const thirtyMinutesFromNow = new Date(now.getTime() + 30 * 60 * 1000);

    tasks.forEach(task => {
        if (!task.dueDate || task.completed) {
            return;
        }

        const deadline = new Date(task.dueDate);

        // Sprawdź, czy data jest poprawna (isNaN sprawdza błędy parsowania)
        if (isNaN(deadline.getTime())) return;

        // Jeśli termin już minął, usuwamy go ze zbioru (aby móc przypomnieć np. przy zmianie daty)
        if (deadline < now) {
            notifiedTasks.delete(task._id);
            return;
        }

        // 2. LOGIKA PRZYPOMNIEŃ: Między teraz a +30 minut
        if (deadline > now && deadline <= thirtyMinutesFromNow) {
            // Sprawdź, czy już wysyłaliśmy powiadomienie o TYM konkretnym zadaniu
            if (!notifiedTasks.has(task._id)) {
                showNotification(task);
                notifiedTasks.add(task._id); // Zapamiętaj wysłanie
            }
        } else {
            // Jeśli termin jest daleki (np. za 2 godziny), upewnij się, że nie ma go w Set,
            // aby przypomnieć o nim, gdy wejdzie w okno 30-minutowe.
            notifiedTasks.delete(task._id);
        }
    });
}

function showNotification(task) {
    const notification = new Notification("Zbliżający się termin!", {
        body: `Zadanie: "${task.title}" kończy się wkrótce!`,
        icon: "/path/to/your/icon.png" // Możesz dodać ikonkę swojej aplikacji
    });

    notification.onclick = () => {
        window.focus(); // Po kliknięciu wróć do karty aplikacji
    };
}
