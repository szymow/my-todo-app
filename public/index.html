<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern ToDo | Node.js</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); min-height: 100vh; }
        .card { border: none; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .list-group-item { border: none; border-bottom: 1px solid #eee; transition: 0.3s; }
        .list-group-item:hover { background-color: #f8f9fa; }
        .btn-delete { color: #dc3545; cursor: pointer; border: none; background: none; }
        .btn-delete:hover { color: #a71d2a; }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-4">
                <h2 class="text-center mb-4 text-primary"><i class="fas fa-tasks"></i> Moje Zadania</h2>
                
                <div class="input-group mb-3">
                    <input type="text" id="taskInput" class="form-control" placeholder="Co masz do zrobienia?" aria-label="Zadanie">
                    <button class="btn btn-primary" onclick="addTask()">
                        <i class="fas fa-plus"></i> Dodaj
                    </button>
                </div>

                <div class="d-flex justify-content-center gap-2 mb-3">
                    <button class="btn btn-outline-secondary btn-sm" onclick="setFilter('all')">Wszystkie</button>
                    <button class="btn btn-outline-success btn-sm" onclick="setFilter('completed')">Ukończone</button>
                    <button class="btn btn-outline-warning btn-sm" onclick="setFilter('active')">Do zrobienia</button>
                </div>

                <ul id="taskList" class="list-group list-group-flush">
                    </ul>
            </div>
        </div>
    </div>
</div>

<script>
// 1. Zaktualizowana funkcja wyświetlania (dodajemy styl i zdarzenie kliknięcia)
async function fetchTasks() {
    const res = await fetch('/tasks');
    const tasks = await res.json();
    const list = document.getElementById('taskList');
    list.innerHTML = '';
    
    tasks.forEach(task => {
        const li = document.createElement('li');
        li.className = 'list-group-item d-flex justify-content-between align-items-center';
        
        // Jeśli ukończone, dodajemy klasę 'text-decoration-line-through' (z Bootstrapa)
        const titleClass = task.completed ? 'text-decoration-line-through text-muted' : '';
        
        li.innerHTML = `
            <span class="${titleClass}" style="cursor: pointer; flex-grow: 1;" onclick="toggleTask('${task._id}')">
                ${task.title}
            </span>
            <button class="btn-delete" onclick="deleteTask('${task._id}')">
                <i class="fas fa-trash-alt"></i>
            </button>
        `;
        list.appendChild(li);
    });
}

// 2. Nowa funkcja wywołująca API
async function toggleTask(id) {
    await fetch(`/tasks/${id}/toggle`, { method: 'PATCH' });
    fetchTasks(); // Odśwież listę
}

    async function addTask() {
        const input = document.getElementById('taskInput');
        if (!input.value.trim()) return; // Nie dodawaj pustych

        await fetch('/tasks', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title: input.value })
        });
        input.value = '';
        fetchTasks();
    }

    async function deleteTask(id) {
        await fetch(`/tasks/${id}`, { method: 'DELETE' });
        fetchTasks();
    }

    fetchTasks();

    let currentFilter = 'all'; // Domyślnie pokazujemy wszystko

// Funkcja zmieniająca filtr i odświeżająca widok
function setFilter(filter) {
    currentFilter = filter;
    fetchTasks();
}

async function fetchTasks() {
    const res = await fetch('/tasks');
    let tasks = await res.json();
    const list = document.getElementById('taskList');
    list.innerHTML = '';

    // Logika filtrowania tablicy zadań
    if (currentFilter === 'completed') {
        tasks = tasks.filter(t => t.completed === true);
    } else if (currentFilter === 'active') {
        tasks = tasks.filter(t => t.completed === false);
    }

    tasks.forEach(task => {
        const li = document.createElement('li');
        li.className = 'list-group-item d-flex justify-content-between align-items-center';
        
        const titleClass = task.completed ? 'text-decoration-line-through text-muted' : '';
        
        li.innerHTML = `
            <span class="${titleClass}" style="cursor: pointer; flex-grow: 1;" onclick="toggleTask('${task._id}')">
                ${task.title}
            </span>
            <button class="btn-delete" onclick="deleteTask('${task._id}')">
                <i class="fas fa-trash-alt"></i>
            </button>
        `;
        list.appendChild(li);
    });
}

</script>
</body>
</html>
